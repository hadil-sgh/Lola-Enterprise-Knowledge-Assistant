<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Lola - Enterprise Knowledge Assistant</title>
  <desc id="d">Banner showing the RAG pipeline: documents, embeddings, hybrid retrieval, rerank, local LLM, cited answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>

  <rect x="64" y="58" width="84" height="84" rx="24" fill="url(#logo)"/>
  <text x="106" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#312e81">L</text>

  <text x="172" y="100" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Lola</text>
  <text x="172" y="136" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#c7d2fe">Enterprise Knowledge Assistant</text>
  <text x="64" y="190" font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="19" fill="#e0e7ff">Ask your documents. Get cited answers. Fully local.</text>

  <g font-family="Segoe UI, system-ui, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g transform="translate(64 232)">
      <rect width="150" height="44" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="75" y="28" fill="#ffffff">Documents</text>
    </g>
    <g transform="translate(236 232)">
      <rect width="150" height="44" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="75" y="28" fill="#ffffff">Embeddings</text>
    </g>
    <g transform="translate(408 232)">
      <rect width="190" height="44" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="95" y="28" fill="#ffffff">FAISS + BM25 hybrid</text>
    </g>
    <g transform="translate(620 232)">
      <rect width="130" height="44" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="65" y="28" fill="#ffffff">Rerank</text>
    </g>
    <g transform="translate(772 232)">
      <rect width="150" height="44" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="75" y="28" fill="#ffffff">Ollama LLM</text>
    </g>
    <g transform="translate(944 232)">
      <rect width="192" height="44" rx="12" fill="#ffffff" stroke="#ffffff"/>
      <text x="96" y="28" fill="#3730a3">Cited answer</text>
    </g>
  </g>
  <g stroke="#c7d2fe" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 254h14m-5-5l5 5-5 5"/>
    <path d="M390 254h14m-5-5l5 5-5 5"/>
    <path d="M602 254h14m-5-5l5 5-5 5"/>
    <path d="M754 254h14m-5-5l5 5-5 5"/>
    <path d="M926 254h14m-5-5l5 5-5 5"/>
  </g>

  <g transform="translate(900 70)" opacity="0.9">
    <circle cx="0" cy="40" r="7" fill="#c7d2fe"/>
    <circle cx="70" cy="0" r="9" fill="#ddd6fe"/>
    <circle cx="150" cy="52" r="6" fill="#c7d2fe"/>
    <circle cx="215" cy="14" r="8" fill="#ddd6fe"/>
    <circle cx="110" cy="100" r="7" fill="#c7d2fe"/>
    <g stroke="#c7d2fe" stroke-opacity="0.55" stroke-width="1.5">
      <line x1="0" y1="40" x2="70" y2="0"/>
      <line x1="70" y1="0" x2="150" y2="52"/>
      <line x1="150" y1="52" x2="215" y2="14"/>
      <line x1="0" y1="40" x2="110" y2="100"/>
      <line x1="110" y1="100" x2="150" y2="52"/>
      <line x1="70" y1="0" x2="110" y2="100"/>
    </g>
  </g>
</svg>
